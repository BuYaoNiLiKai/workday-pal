<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workday Pal</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="titlebar">
        <div class="brand">
          <span class="brand-mark">W</span>
          <strong>下班搭子</strong>
          <span id="todayLabel">今天</span>
        </div>
        <nav class="window-actions" aria-label="窗口操作">
          <button id="settingsButton" title="设置" aria-label="设置">⚙</button>
          <button id="dressButton" title="装扮" aria-label="装扮">✦</button>
          <span class="action-divider"></span>
          <button id="minimizeButton" title="最小化" aria-label="最小化">−</button>
          <button id="closeButton" class="close-action" title="关闭" aria-label="关闭">×</button>
        </nav>
      </header>

      <section class="content">
        <section class="pet-stage">
          <div class="scene-accent"></div>
          <img id="characterImage" alt="桌面搭子" />
          <div class="pet-identity">
            <span id="characterName" class="pet-name">橘子</span>
            <span class="online-dot" title="陪伴中"></span>
          </div>
        </section>

        <section class="timer-panel">
          <div class="status-row">
            <span id="statusLabel">准备中</span>
            <span id="overtimeBadge">加班中</span>
          </div>
          <div id="countdownLabel" class="countdown">00:00:00</div>
          <div id="captionLabel" class="caption">正在整理今天的节奏</div>

          <div class="progress-wrap">
            <div class="progress-track" aria-label="今日工作进度">
              <div id="progressFill"></div>
            </div>
            <span id="progressLabel">0%</span>
          </div>

          <div class="water-strip">
            <span class="water-icon">●</span>
            <span>喝水提醒</span>
            <strong id="waterHintLabel">45 分钟后</strong>
          </div>

          <div class="command-row">
            <button id="overtimeButton" class="primary">加班</button>
            <button id="quickWaterButton">我喝水了</button>
          </div>
        </section>
      </section>
    </main>

    <div id="modalLayer" class="modal-layer hidden">
      <section id="settingsModal" class="modal settings-modal hidden">
        <header class="modal-heading">
          <div>
            <p id="settingsEyebrow">设置</p>
            <h1 id="settingsTitle">调整工作节奏</h1>
          </div>
          <span class="heading-mark">◷</span>
        </header>

        <div class="settings-scroll">
          <section class="setting-section">
            <div class="section-heading">
              <strong>工作时间</strong>
              <span>按一天的顺序设置</span>
            </div>
            <div class="form-grid time-grid">
              <label><span>上班</span><input id="workStartInput" type="time" /></label>
              <label><span>午休开始</span><input id="breakStartInput" type="time" /></label>
              <label><span>午休结束</span><input id="breakEndInput" type="time" /></label>
              <label><span>下班</span><input id="workEndInput" type="time" /></label>
            </div>
          </section>

          <section class="setting-section preferences-section">
            <div class="preference-row">
              <label class="toggle-row" for="waterEnabledInput">
                <input id="waterEnabledInput" type="checkbox" />
                <span class="toggle-control"></span>
                <span class="preference-copy"><strong>喝水提醒</strong><small>工作时由搭子提醒你</small></span>
              </label>
              <label class="compact-field"><span>间隔</span><input id="waterMinutesInput" type="number" min="15" max="240" step="5" /><em>分钟</em></label>
            </div>
            <div class="preference-row scale-row">
              <div class="preference-copy"><strong>界面大小</strong><small>调整悬浮窗显示比例</small></div>
              <label class="range-field">
                <input id="scaleInput" type="range" min="80" max="150" step="5" />
                <output id="scaleValue">100%</output>
              </label>
            </div>
          </section>
        </div>

        <p id="settingsError" class="error"></p>
        <footer>
          <button id="settingsCancelButton">取消</button>
          <button id="settingsSaveButton" class="primary">确定</button>
        </footer>
      </section>

      <section id="dressModal" class="modal wide hidden">
        <header>
          <div>
            <p>装扮</p>
            <h1>选择每天陪你的搭子</h1>
          </div>
        </header>
        <label class="name-field">名字<input id="nameInput" maxlength="12" /></label>
        <div id="characterGrid" class="card-grid"></div>
        <h2>动作预览</h2>
        <div id="actionGrid" class="action-grid"></div>
        <p id="dressError" class="error"></p>
        <footer>
          <button id="dressCancelButton">取消</button>
          <button id="dressSaveButton" class="primary">确定</button>
        </footer>
      </section>

      <section id="overtimeModal" class="modal small hidden">
        <header>
          <div>
            <p>加班</p>
            <h1>今晚预计几点收工？</h1>
          </div>
        </header>
        <label>加班结束<input id="overtimeEndInput" type="time" /></label>
        <p id="overtimeError" class="error"></p>
        <footer>
          <button id="overtimeCancelButton">取消</button>
          <button id="overtimeSaveButton" class="primary">确定</button>
        </footer>
      </section>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
